[project]
name = "slippery-maze-training"
version = "0.1.0"
description = "Small Transformer: dynamics pretraining, BFS imitation, and interactive GRPO"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5,<3",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "ipywidgets>=8.1,<9",
]

[project.optional-dependencies]
dev = ["nbformat>=5,<6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maze_training*"]
